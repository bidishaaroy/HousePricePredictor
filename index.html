<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Housing Price Predictor</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 28px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font: inherit;
            border: 1px solid #b8bec5;
            border-radius: 5px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: 2px solid #4c8bf5;
            border-color: transparent;
        }

        .hint {
            margin: 0;
            font-size: 0.85rem;
            color: #606870;
        }

        button {
            margin-top: 22px;
            padding: 11px 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #output {
            min-height: 60px;
            margin-top: 24px;
            padding: 16px;
            background: #eef1f4;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Housing Price Predictor</h1>

        <p>
            Enter the property information below to estimate its market price.
        </p>

        <form id="prediction-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="model">Prediction Model</label>
                    <select id="model" required>
                        <option value="">Select Model</option>
                        <option value="linear">Linear Regression</option>
                        <option value="polynomial">Polynomial Regression</option>
                        <option value="piecewise">Piecewise Regression</option>
                        <option value="tree">Decision Tree</option>
                        <option value="tree_per_cluster">Tree per Cluster</option>
                        <option value="best_per_cluster">Best per Cluster</option>
                        <option value="baseline">Baseline</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="neighborhood">Neighborhood</label>
                    <select id="neighborhood" required>
                        <option value="">Select Neighborhood</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Market Year</label>
                    <input
                        id="year"
                        type="number"
                        min="2004"
                        max="2023"
                        step="1"
                        placeholder="Example: 2023"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="property-type">Property Type</label>
                    <select id="property-type" required>
                        <option value="">Select Proper Type</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bedrooms">Bedrooms</label>
                    <select id="bedrooms" required>
                        <option value="">Select # Bedrooms</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bathrooms">Bathrooms</label>
                    <select id="bathrooms" required>
                        <option value="">Select # Bathrooms</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year-built">Year Built</label>
                    <input
                        id="year-built"
                        type="number"
                        min="1000"
                        max="2026"
                        step="1"
                        placeholder="Example: 1995"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="renovation-year">Renovation Year</label>
                    <input
                        id="renovation-year"
                        type="number"
                        min="1000"
                        max="2026"
                        step="1"
                        placeholder="Leave it blank if never rennovated"
                    >
                </div>

                <div class="form-group">
                    <label for="garage-type">Garage Type</label>
                    <select id="garage-type" required>
                        <option value="">Select Garage Type</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="house-square-footage">
                        House Square Footage
                    </label>

                    <input
                        id="house-square-footage"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="Example: 2400"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="land-square-footage">
                        Land Square Footage
                    </label>

                    <input
                        id="land-square-footage"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="Example: 5000"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="basement">Basement</label>
                    <select id="basement" required>
                        <option value="">Select Basement</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="legal-units">Legal Units</label>
                    <select id="legal-units" required>
                        <option value="">Select Legal Units</option>
                    </select>
                </div>
            </div>

            <button id="submit-button" type="submit" disabled>
                Predict Market Price
            </button>
        </form>

        <div id="output">Loading feature options...</div>
    </main>

    <script>
        const form = document.querySelector("#prediction-form");
        const output = document.querySelector("#output");
        const submitButton = document.querySelector("#submit-button");

        const inputs = {
            model: document.querySelector("#model"),
            neighborhood: document.querySelector("#neighborhood"),
            year: document.querySelector("#year"),
            propertyType: document.querySelector("#property-type"),
            bedrooms: document.querySelector("#bedrooms"),
            bathrooms: document.querySelector("#bathrooms"),
            yearBuilt: document.querySelector("#year-built"),
            renovationYear: document.querySelector("#renovation-year"),
            garageType: document.querySelector("#garage-type"),
            houseSquareFootage:
                document.querySelector("#house-square-footage"),
            landSquareFootage:
                document.querySelector("#land-square-footage"),
            basement: document.querySelector("#basement"),
            legalUnits: document.querySelector("#legal-units")
        };

        const dropdownFields = [
            {
                jsonKey: "Neighborhood",
                element: inputs.neighborhood
            },
            {
                jsonKey: "Property Type",
                element: inputs.propertyType
            },
            {
                jsonKey: "Bedrooms",
                element: inputs.bedrooms
            },
            {
                jsonKey: "Bathrooms",
                element: inputs.bathrooms
            },
            {
                jsonKey: "Garage Type",
                element: inputs.garageType
            },
            {
                jsonKey: "Basement",
                element: inputs.basement
            },
            {
                jsonKey: "Legal Units",
                element: inputs.legalUnits
            }
        ];

        function fillDropdown(selectElement, fieldName, values) {
            selectElement.innerHTML = "";

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = `Select ${fieldName}`;
            placeholder.disabled = true;
            placeholder.selected = true;

            selectElement.appendChild(placeholder);

            for (const value of values) {
                const option = document.createElement("option");

                option.value = value;
                option.textContent = value;

                selectElement.appendChild(option);
            }
        }

        async function loadOptions() {
            try {
                const response = await fetch("/options.json");

                if (!response.ok) {
                    throw new Error(
                        `Could not load options.json (${response.status}).`
                    );
                }

                const options = await response.json();

                for (const field of dropdownFields) {
                    const values = options[field.jsonKey];

                    if (!Array.isArray(values)) {
                        throw new Error(
                            `Missing options for "${field.jsonKey}".`
                        );
                    }

                    fillDropdown(
                        field.element,
                        field.jsonKey,
                        values
                    );
                }

                submitButton.disabled = false;
                output.textContent = "Ready for a prediction.";
            } catch (error) {
                submitButton.disabled = true;
                output.textContent =
                    `Error loading feature options: ${error.message}`;
            }
        }

        function getNumber(input, fieldName) {
            const value = Number(input.value);

            if (!Number.isFinite(value)) {
                throw new Error(`${fieldName} must be a valid number.`);
            }

            return value;
        }

        function buildFeatureData() {
            const yearBuilt = getNumber(
                inputs.yearBuilt,
                "Year Built"
            );

            const renovationYear = inputs.renovationYear.value === ""
                ? yearBuilt
                : getNumber(
                    inputs.renovationYear,
                    "Renovation Year"
                );

            if (renovationYear < yearBuilt) {
                throw new Error(
                    "Renovation Year cannot be earlier than Year Built."
                );
            }

            return {
                "Neighborhood": inputs.neighborhood.value,
                "Year": getNumber(inputs.year, "Market Year"),
                "Property Type": inputs.propertyType.value,
                "Bedrooms": getNumber(inputs.bedrooms, "Bedrooms"),
                "Bathrooms": getNumber(inputs.bathrooms, "Bathrooms"),
                "Year Built": yearBuilt,
                "Renovation Year": renovationYear,
                "Garage Type": inputs.garageType.value,
                "Square Footage (House)": getNumber(
                    inputs.houseSquareFootage,
                    "House Square Footage"
                ),
                "Square Footage (Land)": getNumber(
                    inputs.landSquareFootage,
                    "Land Square Footage"
                ),
                "Basement": inputs.basement.value,
                "Legal Units": getNumber(
                    inputs.legalUnits,
                    "Legal Units"
                )
            };
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            submitButton.disabled = true;
            output.textContent = "Sending property data to Python...";

            try {
                const features = buildFeatureData();
                const model = inputs.model.value;

                if (!model) {
                    throw new Error("Please select a prediction model.");
                }

                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ model, features })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.error || "Prediction request failed."
                    );
                }

                output.textContent = data.result;
            } catch (error) {
                output.textContent = `Error: ${error.message}`;
            } finally {
                submitButton.disabled = false;
            }
        });

        loadOptions();
    </script>
</body>
</html>
